name: Format agent scaling PR
on:
  push:
    branches:
      - feat/backend-authoritative-heartbeat-20261109
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go sources
        run: |
          gofmt -w cmd/edge-agent/main.go internal/agent/agent.go internal/inventory/agent_health.go internal/inventory/agent_health_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/edge-agent/main.go internal/agent/agent.go internal/inventory/agent_health.go internal/inventory/agent_health_test.go
            git commit -m "style: gofmt agent scaling implementation"
            git push
          fi
