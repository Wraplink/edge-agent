name: Format origin DNS feature
on:
  push:
    branches: [feature/agent-origin-dns-endpoint]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: |
          gofmt -w cmd/edge-agent/main.go internal/agent/agent.go internal/client/client.go internal/config/config.go internal/origindns/handler.go internal/origindns/handler_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/edge-agent/main.go internal/
            git commit -m "style: gofmt origin DNS feature"
            git push
          fi
