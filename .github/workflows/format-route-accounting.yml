name: Format Full Route accounting branch
on:
  push:
    branches: [feat/full-route-accounting-foundation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Go sources
        run: |
          gofmt -w internal/dataplane/nftables.go internal/usage/
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/dataplane/nftables.go internal/usage/
            git commit -m "style: gofmt Full Route accounting implementation"
            git push
          fi
