name: Slack project reporting
on:
  issues:
    types: [opened, reopened, closed]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review]
  workflow_run:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name != 'Slack project reporting') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WRAPLINK_SLACK_WEBHOOK_URL }}
        run: python3 scripts/notify_slack.py
