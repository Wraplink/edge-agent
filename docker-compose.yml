services:
  edge-agent:
    build:
      context: .

    container_name: edge-agent

    restart: unless-stopped

    # nftables netlink operations require effective CAP_NET_ADMIN at process startup.
    # Docker's cap_add alone is insufficient with the image's non-root USER.
    user: "0:0"
    network_mode: host

    cap_add:
      - NET_ADMIN
      - NET_RAW

    env_file:
      - .env.local
    volumes:
      - ./config.yml:/etc/edge-agent/config.yml:ro