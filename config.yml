dns_control:
  url: ${DNS_CONTROL_API_URL}
  token: ${DNS_CONTROL_API_TOKEN}

backend:
  # Required when agent.capacity.route > 0. Must be reachable from the edge host.
  url: ${WRAPLINK_BACKEND_URL}
  control_key: ${NETWORK_CONTROL_KEY}
  # Dedicated IPv4 addresses assigned to this host; do not advertise unrelated IPs.
  route_public_ips: [] # Add dedicated route IPs when route capacity is enabled

agent:
  id: "${EDGE_AGENT_ID}"
  region: "${EDGE_AGENT_REGION}"
  interval: 10s
  capacity:
    sni: ${EDGE_SNI_CAPACITY}
    route: ${EDGE_ROUTE_CAPACITY}

edge:
  # Enable local host Full Route forwarding (default: false).
  local_output_dnat: false
  # Independent DNS for original SNI destinations; never point to WrapLink DNS Control.
  upstream_dns:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
  addresses:
    - "${EDGE_PUBLIC_IP}"
  sni:
    enabled: ${EDGE_SNI_ENABLED}
    listen_address: "${EDGE_SNI_LISTEN_ADDRESS}"
    max_connections: 1024
    client_hello_timeout: 5s

# Optional read-only access diagnostics API. Keep private; never expose publicly.
diagnostics:
  enabled: false
  listen_address: "127.0.0.1:9091"
  token: "" # Set to ${WRAPLINK_DIAGNOSTICS_TOKEN} when enabling diagnostics
